version: '3.8'

services:
  app:
    build: .
    ports:
      - "80:80"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=decontador_db
      - DB_USERNAME=root
      - DB_PASSWORD=admin123
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: decontador_db
      MYSQL_ROOT_PASSWORD: admin123
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: